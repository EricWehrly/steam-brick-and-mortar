# SteamVR Blockbuster Shelf - Development Environment
# Focus: Blender 3D asset generation pipeline + Node.js Steam protocol testing

services:
  # Generate 3D shelf models with Blender
  blender:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    working_dir: /app
    volumes:
      - .:/app
      - blender-cache:/root/.cache/blender
    environment:
      - PYTHONPATH=/app
    command: >
      sh -c "
        pip install -r requirements.txt &&
        echo 'Blender environment ready. Run: docker compose run blender python blender/gen_shelf.py'
      "

  # Node.js environment for Steam protocol testing and API integration
  nodejs:
    build:
      context: .
      dockerfile: docker/Dockerfile.nodejs
    working_dir: /app
    volumes:
      - ./external-tool:/app
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
    command: npm run test-browser

  # Playwright visual tools — screenshot capture and console log collection
  # Targets the Vite dev server running on the host (host.docker.internal:5173)
  # Run: docker compose run --rm playwright
  # Or:  yarn test:visual:docker  (from client/)
  playwright:
    build:
      context: .
      dockerfile: docker/Dockerfile.playwright
    environment:
      - PLAYWRIGHT_BASE_URL=http://host.docker.internal:5173
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount test-results back to host so screenshots/reports are accessible
      - ./client/test-results:/app/test-results

volumes:
  blender-cache:
    driver: local
