<div class="panel-header clickable-header" id="lighting-panel-header">
    <h3><span class="panel-icon">💡</span><span class="panel-title"> Lighting Controls</span></h3>
    <div class="header-controls">
        <button class="refresh-button ui-button icon" id="refresh-lights">🔄</button>
        <span class="toggle-indicator" id="toggle-indicator">▶</span>
    </div>
</div>
<div class="panel-content" id="lighting-panel-content">
    <div class="master-controls">
        <label class="control-item">
            <span class="control-label ui-control-label">All Lights</span>
            <input type="range" min="0" max="3" step="0.01" class="master-brightness-slider" id="all-lights-slider" value="1">
            <span class="slider-value" id="all-lights-value">100%</span>
        </label>
        <label class="control-item">
            <span class="control-label ui-control-label">Exposure</span>
            <input type="range" min="0.05" max="2.0" step="0.01" id="exposure-slider" value="{{exposureValue}}">
            <span class="slider-value" id="exposure-value">{{exposureValue}}</span>
        </label>
        <label class="control-item">
            <input type="checkbox" class="ui-checkbox" id="debug-indicator-toggle" {{#checked debugIndicatorEnabled}}checked{{/checked}}>
            <span class="control-label ui-control-label">Show Debug Indicators</span>
        </label>
    </div>
    <div class="light-groups" id="light-groups-container">
        <!-- Light groups with nested individual lights are populated dynamically -->
    </div>
</div>
