<!-- Interface Settings -->
<div class="app-section panel-card pause-section">
    <h4>Interface Settings</h4>
    <div class="settings-grid pause-row-list">
        <div class="setting-item checkbox-item pause-row pause-disabled-row">
            <label class="checkbox-label pause-row-text">
                <input type="checkbox" class="ui-checkbox" id="show-fps-toggle" {{#checked showFPS}}checked{{/checked}} disabled>
                <span class="label-text">Show FPS Counter</span>
                <span class="control-disabled-note pause-disabled-note">disabled</span>
            </label>
        </div>
        
        <div class="setting-item checkbox-item pause-row pause-disabled-row">
            <label class="checkbox-label pause-row-text">
                <input type="checkbox" class="ui-checkbox" id="show-perf-toggle" {{#checked showPerformanceStats}}checked{{/checked}} disabled>
                <span class="label-text">Show Performance Stats</span>
                <span class="control-disabled-note pause-disabled-note">disabled</span>
            </label>
        </div>
        
        <div class="setting-item checkbox-item pause-row pause-disabled-row">
            <label class="checkbox-label pause-row-text">
                <input type="checkbox" class="ui-checkbox" id="hide-ui-vr-toggle" {{#checked hideUIInVR}}checked{{/checked}} disabled>
                <span class="label-text">Hide UI in VR Mode</span>
                <span class="control-disabled-note pause-disabled-note">disabled</span>
            </label>
        </div>
    </div>
</div>

<!-- Debug Settings (for development) -->
<div class="app-section debug-section panel-card pause-section">
    <h4>Debug & Development</h4>
    <div class="settings-grid pause-row-list">
        <div class="setting-item checkbox-item pause-row pause-disabled-row">
            <label class="checkbox-label pause-row-text">
                <input type="checkbox" class="ui-checkbox" id="verbose-logging-toggle" {{#checked verboseLogging}}checked{{/checked}} disabled>
                <span class="label-text">Verbose Logging</span>
                <span class="control-disabled-note pause-disabled-note">disabled</span>
            </label>
        </div>
        
        <div class="setting-item checkbox-item pause-row pause-disabled-row">
            <label class="checkbox-label pause-row-text">
                <input type="checkbox" class="ui-checkbox" id="show-debug-toggle" {{#checked showDebugInfo}}checked{{/checked}} disabled>
                <span class="label-text">Show Debug Info</span>
                <span class="control-disabled-note pause-disabled-note">disabled</span>
            </label>
        </div>
    </div>
    
</div>

<!-- General Settings -->
<div class="app-section panel-card pause-section">
    <h4>General Settings</h4>
    <div class="settings-grid pause-row-list">
        <div class="setting-item checkbox-item pause-row">
            <label class="checkbox-label pause-row-text">
                <input type="checkbox" class="ui-checkbox" id="auto-save-toggle" {{#checked autoSave}}checked{{/checked}}>
                <span class="label-text">Auto-save Settings</span>
            </label>
        </div>
    </div>
    
    <div class="general-actions">
        <button id="reset-settings-btn" class="pause-btn warning">
            <span class="btn-icon">🔄</span>
            Reset to Defaults
        </button>
        <button id="export-settings-btn" class="pause-btn secondary">
            <span class="btn-icon">📁</span>
            Export Settings
        </button>
        <button id="import-settings-btn" class="pause-btn secondary">
            <span class="btn-icon">📂</span>
            Import Settings
        </button>
    </div>
</div>
