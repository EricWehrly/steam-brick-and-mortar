<!-- General Settings -->
<div class="app-section panel-card pause-section">
    <h4>General Settings</h4>
    <div class="settings-grid pause-row-list">
        <div class="setting-item checkbox-item pause-row">
            <label class="checkbox-label pause-row-text ui-checkbox-row">
                <input type="checkbox" class="ui-checkbox" id="auto-save-toggle" {{#checked autoSave}}checked{{/checked}}>
                <span class="label-text">Auto-save Settings</span>
            </label>
        </div>
    </div>
    
    <div class="general-actions">
        <button id="reset-settings-btn" class="pause-btn warning">
            <span class="btn-icon ui-inline-icon">🔄</span>
            Reset to Defaults
        </button>
        <button id="export-settings-btn" class="pause-btn secondary">
            <span class="btn-icon ui-inline-icon">📁</span>
            Export Settings
        </button>
        <button id="import-settings-btn" class="pause-btn secondary">
            <span class="btn-icon ui-inline-icon">📂</span>
            Import Settings
        </button>
    </div>
</div>
