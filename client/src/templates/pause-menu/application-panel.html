<!-- Application Control -->
<div class="app-section">
    <h4>Application Control</h4>
    <div class="control-buttons">
        <!-- TODO: Consider moving fullscreen button to main pause menu header for better accessibility -->
        <button id="app-fullscreen-btn" class="pause-btn secondary">
            <span class="btn-icon">🖥️</span>
            <span class="btn-text">Toggle Fullscreen</span>
            <span class="btn-shortcut">F11</span>
        </button>
    </div>
</div>

<!-- Interface Settings -->
<div class="app-section">
    <h4>Interface Settings</h4>
    <div class="settings-grid">
        <div class="setting-item checkbox-item">
            <label class="checkbox-label">
                <input type="checkbox" class="ui-checkbox" id="show-fps-toggle" {{#checked showFPS}}checked{{/checked}}>
                <span class="label-text">Show FPS Counter</span>
            </label>
        </div>
        
        <div class="setting-item checkbox-item">
            <label class="checkbox-label">
                <input type="checkbox" class="ui-checkbox" id="show-perf-toggle" {{#checked showPerformanceStats}}checked{{/checked}}>
                <span class="label-text">Show Performance Stats</span>
            </label>
        </div>
        
        <div class="setting-item checkbox-item">
            <label class="checkbox-label">
                <input type="checkbox" class="ui-checkbox" id="hide-ui-vr-toggle" {{#checked hideUIInVR}}checked{{/checked}}>
                <span class="label-text">Hide UI in VR Mode</span>
            </label>
        </div>
    </div>
</div>

<!-- Debug Settings (for development) -->
<div class="app-section debug-section">
    <h4>Debug & Development</h4>
    <div class="settings-grid">
        <div class="setting-item checkbox-item">
            <label class="checkbox-label">
                <input type="checkbox" class="ui-checkbox" id="verbose-logging-toggle" {{#checked verboseLogging}}checked{{/checked}}>
                <span class="label-text">Verbose Logging</span>
            </label>
        </div>
        
        <div class="setting-item checkbox-item">
            <label class="checkbox-label">
                <input type="checkbox" class="ui-checkbox" id="show-debug-toggle" {{#checked showDebugInfo}}checked{{/checked}}>
                <span class="label-text">Show Debug Info</span>
            </label>
        </div>
    </div>
    
    <div class="debug-actions">
        <button id="export-logs-btn" class="pause-btn secondary">
            <span class="btn-icon">📋</span>
            Export Debug Logs
        </button>
    </div>
</div>

<!-- General Settings -->
<div class="app-section">
    <h4>General Settings</h4>
    <div class="settings-grid">
        <div class="setting-item checkbox-item">
            <label class="checkbox-label">
                <input type="checkbox" class="ui-checkbox" id="auto-save-toggle" {{#checked autoSave}}checked{{/checked}}>
                <span class="label-text">Auto-save Settings</span>
            </label>
        </div>
    </div>
    
    <div class="general-actions">
        <button id="reset-settings-btn" class="pause-btn warning">
            <span class="btn-icon">🔄</span>
            Reset to Defaults
        </button>
        <button id="export-settings-btn" class="pause-btn secondary">
            <span class="btn-icon">📁</span>
            Export Settings
        </button>
        <button id="import-settings-btn" class="pause-btn secondary">
            <span class="btn-icon">📂</span>
            Import Settings
        </button>
    </div>
</div>
